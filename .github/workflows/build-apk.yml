name: APK bauen

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: APK bauen
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk HifiTests.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HifiTests-apk
          path: HifiTests.apk
      - name: Als Release „neueste“ veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete neueste --yes --cleanup-tag || true
          gh release create neueste HifiTests.apk \
            --title "HiFi Tests – neueste Version (Build ${{ github.run_number }})" \
            --notes "APK herunterladen und auf dem Handy öffnen. Updates installieren sich über die alte Version, Daten bleiben erhalten."
