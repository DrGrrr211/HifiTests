name: Tests sammeln

on:
  schedule:
    - cron: "17 4,16 * * *"   # zweimal täglich (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Feeds abrufen
        run: python collector/collect.py
      - name: Ergebnis speichern
        run: |
          git config user.name "hifitests-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Daten aktualisiert $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
